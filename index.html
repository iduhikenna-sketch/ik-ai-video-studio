<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IK AI VIDEO STUDIO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
            min-height: 100vh;
        }

        header {
            background: #0b5cff;
            color: white;
            padding: 22px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #0b5cff;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .option {
            border: 2px solid #dbe2ea;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #0b5cff;
        }

        .option input {
            display: none;
        }

        .option.selected {
            border-color: #0b5cff;
            background: #eef4ff;
        }

        .option-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .option-description {
            font-size: 12px;
            color: #6b7280;
        }

        .image-preview {
            margin-top: 18px;
            display: none;
            text-align: center;
        }

        .image-preview img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 14px;
        }

        .delete-button {
            margin-top: 12px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .video-count {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .duration {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .select-button {
            border: 2px solid #dbe2ea;
            background: white;
            padding: 14px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .select-button:hover {
            border-color: #0b5cff;
        }

        .select-button.selected {
            background: #0b5cff;
            border-color: #0b5cff;
            color: white;
        }

        .generate-button {
            width: 100%;
            background: #0b5cff;
            color: white;
            border: none;
            padding: 17px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-button:hover {
            background: #0847c7;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 23px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .video-count {
                grid-template-columns: repeat(4, 1fr);
            }

            .duration {
                grid-template-columns: repeat(2, 1fr);
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 IK AI VIDEO STUDIO</h1>
    <p>Create AI videos from your ideas</p>
</header>

<main class="container">

    <!-- PROMPT -->
    <section class="card">

        <h2>📝 Your Prompt</h2>

        <textarea
            id="prompt"
            placeholder="Describe the video you want to create..."
        ></textarea>

    </section>


    <!-- IMAGE SOURCE -->
    <section class="card">

        <h2>🖼️ Image Source</h2>

        <div class="options">

            <label class="option selected" id="generateImageOption">

                <input
                    type="radio"
                    name="imageSource"
                    value="generate"
                    checked
                >

                <div class="option-title">
                    ✨ Generate Image
                </div>

                <div class="option-description">
                    Create an image from your prompt
                </div>

            </label>


            <label class="option" id="uploadImageOption">

                <input
                    type="radio"
                    name="imageSource"
                    value="upload"
                >

                <div class="option-title">
                    📤 Upload Image
                </div>

                <div class="option-description">
                    Use an image from your device
                </div>

            </label>


            <label class="option" id="noImageOption">

                <input
                    type="radio"
                    name="imageSource"
                    value="none"
                >

                <div class="option-title">
                    🚫 No Image
                </div>

                <div class="option-description">
                    Generate without an image
                </div>

            </label>

        </div>


        <!-- Hidden file input -->

        <input
            type="file"
            id="imageUpload"
            accept="image/*"
            style="display:none;"
        >


        <!-- Image Preview -->

        <div
            class="image-preview"
            id="imagePreview"
        >

            <img
                id="previewImage"
                src=""
                alt="Selected image"
            >

            <br>

            <button
                class="delete-button"
                id="deleteImage"
                type="button"
            >
                🗑️ Delete Image
            </button>

        </div>

    </section>


    <!-- VIDEO QUANTITY -->
    <section class="card">

        <h2>🎥 Number of Videos</h2>

        <div class="video-count">

            <button
                class="select-button selected"
                data-count="1"
                type="button"
            >
                1
            </button>

            <button
                class="select-button"
                data-count="2"
                type="button"
            >
                2
            </button>

            <button
                class="select-button"
                data-count="3"
                type="button"
            >
                3
            </button>

            <button
                class="select-button"
                data-count="4"
                type="button"
            >
                4
            </button>

        </div>

    </section>


    <!-- VIDEO DURATION -->
    <section class="card">

        <h2>⏱️ Video Duration</h2>

        <div class="duration">

            <button
                class="select-button selected"
                data-duration="30 seconds"
                type="button"
            >
                30 sec
            </button>

            <button
                class="select-button"
                data-duration="1 minute"
                type="button"
            >
                1 min
            </button>

            <button
                class="select-button"
                data-duration="2 minutes"
                type="button"
            >
                2 min
            </button>

            <button
                class="select-button"
                data-duration="3 minutes"
                type="button"
            >
                3 min
            </button>

            <button
                class="select-button"
                data-duration="5 minutes"
                type="button"
            >
                5 min
            </button>

        </div>

    </section>


    <!-- GENERATE -->
    <section class="card">

        <button
            class="generate-button"
            id="generateVideo"
            type="button"
        >
            🚀 Generate Video
        </button>

        <div
            class="status"
            id="status"
        >
            Ready to create your video.
        </div>

    </section>

</main>


<footer>
    © 2026 IK BASIC DIGITAL SOLUTIONS
</footer>


<script>

    // Image source options

    const options = document.querySelectorAll(".option");

    options.forEach(option => {

        option.addEventListener("click", () => {

            options.forEach(item => {
                item.classList.remove("selected");
            });

            option.classList.add("selected");

            const input = option.querySelector("input");
            input.checked = true;

            if (input.value === "upload") {

                document
                    .getElementById("imageUpload")
                    .click();

            }

            if (input.value === "none") {

                document
                    .getElementById("imagePreview")
                    .style.display = "none";

            }

        });

    });


    // Upload image

    const imageUpload =
        document.getElementById("imageUpload");

    imageUpload.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            document
                .getElementById("previewImage")
                .src = event.target.result;

            document
                .getElementById("imagePreview")
                .style.display = "block";

        };

        reader.readAsDataURL(file);

    });


    // Delete image

    document
        .getElementById("deleteImage")
        .addEventListener("click", function () {

            imageUpload.value = "";

            document
                .getElementById("previewImage")
                .src = "";

            document
                .getElementById("imagePreview")
                .style.display = "none";

        });


    // Video quantity selection

    const countButtons =
        document.querySelectorAll(
            ".video-count .select-button"
        );

    countButtons.forEach(button => {

        button.addEventListener("click", () => {

            countButtons.forEach(item => {
                item.classList.remove("selected");
            });

            button.classList.add("selected");

        });

    });


    // Duration selection

    const durationButtons =
        document.querySelectorAll(
            ".duration .select-button"
        );

    durationButtons.forEach(button => {

        button.addEventListener("click", () => {

            durationButtons.forEach(item => {
                item.classList.remove("selected");
            });

            button.classList.add("selected");

        });

    });


    // Generate button

    document
        .getElementById("generateVideo")
        .addEventListener("click", function () {

            const prompt =
                document.getElementById("prompt").value.trim();

            if (!prompt) {

                document.getElementById("status").textContent =
                    "⚠️ Please enter a video prompt first.";

                return;

            }

            const selectedCount =
                document.querySelector(
                    ".video-count .selected"
                ).dataset.count;

            const selectedDuration =
                document.querySelector(
                    ".duration .selected"
                ).dataset.duration;

            const selectedImageSource =
                document.querySelector(
                    'input[name="imageSource"]:checked'
                ).value;

            document.getElementById("status").textContent =
                "Ready: " +
                selectedCount +
                " video(s), " +
                selectedDuration +
                ", image source: " +
                selectedImageSource +
                ".";

        });

</script>

</body>
</html>
